name: Fix AI Operations Safety Copy

on:
  push:
    branches:
      - feature/work-management
    paths:
      - '.github/workflows/fix-aiops-safety-copy.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/work-management
          fetch-depth: 0
      - name: Apply current execution safety copy
        run: python3 scripts/fix-aiops-safety-copy.py
      - name: Verify
        run: |
          grep -q "CREATE_WORK وESCALATE" src/pages/work/management/AiOperationsManagementPanel.tsx
          git diff --check
      - name: Commit verified copy fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai-ops): align management safety copy with execution"
          git push origin HEAD:feature/work-management
