name: AI Operations Final Pre-Smoke Gate

on:
  pull_request:
    paths:
      - 'supabase/migrations/*ai_operations*'
      - 'supabase/functions/ai-operations-worker/**'
      - 'supabase/rehearsal/**'
      - 'src/features/ai-operations/**'
      - 'src/pages/work/management/AiOperations*'
      - 'src/__tests__/ai-operations*'
      - 'docs/work-management/**'
      - '.github/workflows/aiops-final-closure-gate.yml'
      - '.github/workflows/aiops-closure-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiops-final-pre-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-contracts:
    name: Candidate source and worker contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify AI Operations contracts
        run: npm test -- src/__tests__/ai-operations-*.test.ts src/__tests__/ai-operations-*.test.cjs
      - name: Verify Edge worker type safety
        run: npx --yes deno@2.9.5 check supabase/functions/ai-operations-worker/index.ts
      - name: Verify migration release boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*_ai_operations_*.sql' -printf '%f\n' | sort)
          duplicates="$(printf '%s\n' "${migrations[@]}" | sed -E 's/^([0-9]{14}).*/\1/' | sort | uniq -d)"
          test -z "$duplicates" || { echo "Duplicate AI Operations migration versions: $duplicates" >&2; exit 1; }
          test "${migrations[-1]}" = '20260817012300_ai_operations_legacy_prompt_stage_compatibility.sql'
          test -f supabase/migrations/20260817010300_ai_operations_worker_context_budget_hardening.sql
      - name: Record database qualification boundary
        run: |
          echo 'Database qualification is intentionally performed only against an isolated production-derived clone.'
          echo 'The repository migration directory is not treated as a canonical zero-state bootstrap source.'
