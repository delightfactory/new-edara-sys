name: HR V2 Isolated Database Rehearsal

on:
  push:
    branches:
      - feature/hr-variable-schedules-v2
    paths:
      - supabase/rehearsal/RUN_HR_V2_GATE

permissions:
  contents: read

concurrency:
  group: hr-v2-db-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Restore production-derived HR snapshot and verify V2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate committed production snapshot payloads
        shell: bash
        run: |
          set +e
          output="$(python3 supabase/rehearsal/validate_production_snapshot_payload.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            error_message="$(printf '%s\n' "$output" | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
            echo "::error title=HR V2 snapshot payload validation failed::$error_message"
            exit "$status"
          fi

      - name: Ensure PostgreSQL client exists
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Initialize isolated local Supabase project
        shell: bash
        env:
          SUPABASE_TELEMETRY_DISABLED: '1'
        run: |
          mkdir -p .hr-v2-local
          cd .hr-v2-local
          npx --yes supabase@2.110.0 init

      - name: Start isolated Supabase database only
        shell: bash
        env:
          SUPABASE_TELEMETRY_DISABLED: '1'
        run: |
          cd .hr-v2-local
          npx --yes supabase@2.110.0 db start

      - name: Restore committed HR snapshot and run V2 rehearsal
        shell: bash
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          ROOT_DIR: ${{ github.workspace }}
        run: |
          set +e
          output="$(bash supabase/rehearsal/hr_v2_rehearsal.sh 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            error_message="$(printf '%s\n' "$output" | tail -n 16 | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
            echo "::error title=HR V2 rehearsal failed::$error_message"
            exit "$status"
          fi

      - name: Stop and delete isolated local database
        if: always()
        shell: bash
        env:
          SUPABASE_TELEMETRY_DISABLED: '1'
        run: |
          if [ -d .hr-v2-local/supabase ]; then
            cd .hr-v2-local
            npx --yes supabase@2.110.0 stop --no-backup || true
          fi
