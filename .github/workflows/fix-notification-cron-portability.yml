name: Fix Notification Cron Portability

on:
  push:
    branches:
      - feature/work-management
    paths:
      - '.github/workflows/fix-notification-cron-portability.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/work-management
          fetch-depth: 0
      - name: Apply safe pg_cron guard
        run: python3 scripts/fix-notification-cron-portability.py
      - name: Verify patch shape
        run: |
          grep -q "to_regclass('cron.job') IS NOT NULL" supabase/migrations/46_notification_full_coverage.sql
          grep -q "pg_cron unavailable" supabase/migrations/46_notification_full_coverage.sql
          git diff --check
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(notifications): tolerate missing pg_cron during migration"
          git push origin HEAD:feature/work-management
