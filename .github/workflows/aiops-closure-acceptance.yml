name: AI Operations Closure Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feature/work-management
    paths:
      - supabase/rehearsal/RUN_AI_OPS_GATE

permissions:
  contents: read

concurrency:
  group: aiops-closure-acceptance
  cancel-in-progress: false

jobs:
  repository-gates:
    name: Test, typecheck, build, and worker contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx --yes deno@2.9.5 check supabase/functions/ai-operations-worker/index.ts

  clone-qualification-contract:
    name: Production-clone qualification contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify clone rehearsal fail-closed contract
        run: npm test -- src/__tests__/ai-operations-release-hardening-contract.test.ts
      - name: Preserve the qualification boundary
        run: |
          echo 'This workflow does not replay the repository migration folder from zero.'
          echo 'Release qualification requires run_ai_ops_clone_rehearsal.sh against an explicitly confirmed isolated production-derived clone.'
