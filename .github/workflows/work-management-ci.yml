name: Work Management CI

on:
  push:
    branches:
      - feature/work-management
  pull_request:
    paths:
      - 'src/features/work/**'
      - 'src/pages/work/**'
      - 'src/lib/permissions/work.ts'
      - 'src/components/layout/BottomNav.tsx'
      - 'src/App.tsx'
      - 'src/__tests__/work-management*'
      - 'supabase/migrations/*work_management*'
      - 'vercel.json'
      - '.github/workflows/work-management-ci.yml'

permissions:
  contents: read

concurrency:
  group: work-management-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build
