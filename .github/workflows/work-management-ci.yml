name: Work Management CI

on:
  pull_request:
    # Owner-authorized final candidates only; normal development stays off CI.
    types: [ready_for_review]
    branches:
      - design-system-v2-development

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: work-management-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Unit tests import the Supabase client even when service calls are mocked.
      # Use non-secret inert values so CI never depends on production credentials.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify final candidate before validation
        run: node .github/scripts/final-candidate.cjs design-system-v2-development
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Clean install from committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Verify final candidate after validation
        run: node .github/scripts/final-candidate.cjs design-system-v2-development
        env:
          GH_TOKEN: ${{ github.token }}

  clean-install-windows:
    name: Clean install (Windows)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify final candidate before validation
        run: node .github/scripts/final-candidate.cjs design-system-v2-development
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Clean install from committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify final candidate after validation
        run: node .github/scripts/final-candidate.cjs design-system-v2-development
        env:
          GH_TOKEN: ${{ github.token }}
