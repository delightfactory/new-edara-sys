name: Work Management CI

on:
  push:
    branches:
      - feature/work-management
  pull_request:
    paths:
      - 'src/features/work/**'
      - 'src/pages/work/**'
      - 'src/lib/permissions/work.ts'
      - 'src/components/layout/BottomNav.tsx'
      - 'src/App.tsx'
      - 'src/__tests__/work-management*'
      - 'supabase/migrations/*work_management*'
      - 'vercel.json'
      - '.github/workflows/work-management-ci.yml'

permissions:
  contents: read

concurrency:
  group: work-management-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Unit tests import the Supabase client even when service calls are mocked.
      # Use non-secret inert values so CI never depends on production credentials.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # npm ci on this repository currently needs npm to normalize optional
      # platform packages first. The normalization is ephemeral and must not
      # mutate the committed branch.
      - name: Normalize lockfile in runner
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Report committed lockfile drift
        id: lock_drift
        continue-on-error: true
        run: git diff --exit-code -- package-lock.json

      - name: Clean install from normalized lockfile
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Lockfile maintenance notice
        if: steps.lock_drift.outcome == 'failure'
        run: echo '::warning::Committed package-lock.json is out of sync and should be regenerated in a dedicated dependency-maintenance change.'
