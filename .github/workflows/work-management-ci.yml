name: Work Management CI

on:
  push:
    branches:
      - feature/work-management
  pull_request:
    paths:
      - 'src/features/work/**'
      - 'src/pages/work/**'
      - 'src/lib/permissions/work.ts'
      - 'src/components/layout/BottomNav.tsx'
      - 'src/App.tsx'
      - 'src/__tests__/work-management*'
      - 'supabase/migrations/*work_management*'
      - 'vercel.json'
      - '.github/workflows/work-management-ci.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: work-management-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Unit tests import the Supabase client even when service calls are mocked.
      # Use non-secret inert values so CI never depends on production credentials.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Clean install from committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build

  clean-install-windows:
    name: Clean install (Windows)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Clean install from committed lockfile
        run: npm ci --no-audit --no-fund
