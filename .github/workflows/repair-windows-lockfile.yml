name: Repair Windows npm lockfile

on:
  push:
    branches:
      - feature/work-management
    paths:
      - '.github/workflows/repair-windows-lockfile.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/work-management
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Repair lockfile for Windows from existing dependency graph
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff -- package-lock.json

      - name: Commit repaired lockfile when needed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if (git diff --cached --quiet) {
            Write-Host "No lockfile change was required on Windows."
            exit 0
          }
          git commit -m "chore: repair npm lockfile for clean Windows install"
          git push origin HEAD:feature/work-management
