name: Validate clean npm install

on:
  push:
    branches:
      - feature/work-management
    paths:
      - '.github/workflows/repair-windows-lockfile.yml'

permissions:
  contents: read

jobs:
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/work-management

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Clean install from committed lockfile
        run: npm ci --no-audit --no-fund
