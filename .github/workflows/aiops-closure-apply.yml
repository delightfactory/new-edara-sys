name: AI Operations Closure Apply

on:
  push:
    branches:
      - feature/work-management
    paths:
      - '.github/workflows/aiops-closure-apply.yml'

permissions:
  contents: write

concurrency:
  group: aiops-closure-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/work-management
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Apply closure patch
        run: |
          python3 scripts/apply-aiops-closure.py
          python3 scripts/fix-aiops-closure-hook.py

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Commit verified closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(ai-ops): close execution and worker integration gaps"
          git push origin HEAD:feature/work-management
