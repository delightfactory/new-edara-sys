name: AI Operations Isolated Database Rehearsal

on:
  workflow_dispatch:
  push:
    branches:
      - feature/work-management
    paths:
      - supabase/rehearsal/RUN_AI_OPS_GATE

permissions:
  contents: read

concurrency:
  group: aiops-db-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Apply full migration chain and verify AI Operations runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/work-management

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure PostgreSQL client exists
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Initialize isolated Supabase project
        shell: bash
        env:
          SUPABASE_TELEMETRY_DISABLED: '1'
        run: |
          mkdir -p .aiops-local
          cd .aiops-local
          npx --yes supabase@2.110.0 init

      - name: Start isolated Supabase database only
        shell: bash
        env:
          SUPABASE_TELEMETRY_DISABLED: '1'
        run: |
          cd .aiops-local
          npx --yes supabase@2.110.0 db start

      - name: Apply repository migration chain from zero
        shell: bash
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          ROOT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t migrations < <(python3 - "$ROOT_DIR/supabase/migrations" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          def key(path):
              name = path.name
              match = re.match(r'^(\d+)(.*)$', name)
              if not match:
                  return (10**30, name)
              return (int(match.group(1)), match.group(2))
          for path in sorted(root.glob('*.sql'), key=key):
              print(path.name)
          PY
          )
          echo "Migration files: ${#migrations[@]}"
          for migration in "${migrations[@]}"; do
            echo "::group::$migration"
            set +e
            output="$(psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$ROOT_DIR/supabase/migrations/$migration" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              error_message="$(printf '%s\n' "$output" | tail -n 18 | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
              echo "::error title=Migration failed: $migration::$error_message"
              exit "$status"
            fi
          done

      - name: Verify final AI Operations database surface
        shell: bash
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_domains text[];
            v_policy_hash text;
            v_prompt text;
            v_prompt_version text;
          BEGIN
            IF to_regnamespace('ai_ops') IS NULL THEN
              RAISE EXCEPTION 'ai_ops schema missing';
            END IF;
            v_domains := ai_ops.required_operational_domains();
            IF cardinality(v_domains) <> 7 THEN
              RAISE EXCEPTION 'expected seven operational domains, got %', cardinality(v_domains);
            END IF;

            IF to_regclass('ai_ops.planner_policies') IS NULL THEN
              RAISE EXCEPTION 'planner policy registry missing';
            END IF;
            IF to_regclass('ai_ops.case_outcomes') IS NULL THEN
              RAISE EXCEPTION 'case outcomes ledger missing';
            END IF;
            IF to_regclass('ai_ops.snapshot_global_context') IS NULL THEN
              RAISE EXCEPTION 'frozen snapshot global context missing';
            END IF;
            IF to_regclass('ai_ops.decision_review_bindings') IS NULL THEN
              RAISE EXCEPTION 'full decision review fingerprint binding missing';
            END IF;

            SELECT prompt_version INTO v_prompt_version
            FROM ai_ops.settings WHERE singleton=true;
            IF v_prompt_version IS DISTINCT FROM 'v2' THEN
              RAISE EXCEPTION 'expected configured prompt version v2, got %', v_prompt_version;
            END IF;

            SELECT prompt_hash,system_prompt INTO v_policy_hash,v_prompt
            FROM ai_ops.planner_policies
            WHERE policy_version='v1' AND prompt_version='v2' AND enabled=true;
            IF v_policy_hash IS NULL OR v_policy_hash <> md5(v_prompt) THEN
              RAISE EXCEPTION 'planner v2 policy/hash contract is invalid';
            END IF;

            IF to_regprocedure('ai_ops.decision_full_fingerprint(uuid)') IS NULL THEN
              RAISE EXCEPTION 'full decision fingerprint helper missing';
            END IF;
            IF to_regprocedure('ai_ops.build_actor_feasibility_evidence(uuid)') IS NULL THEN
              RAISE EXCEPTION 'actor feasibility evidence builder missing';
            END IF;
            IF to_regprocedure('ai_ops.build_cross_domain_entity_links(uuid)') IS NULL THEN
              RAISE EXCEPTION 'cross-domain entity-link builder missing';
            END IF;
            IF to_regprocedure('public.ai_ops_commit_reviewed_decision(uuid)') IS NULL THEN
              RAISE EXCEPTION 'reviewed decision commit gateway missing';
            END IF;
            IF to_regprocedure('public.ai_ops_set_case_disposition(uuid,text,timestamp with time zone,text)') IS NULL THEN
              RAISE EXCEPTION 'case disposition gateway missing';
            END IF;
            IF to_regprocedure('public.ai_ops_revise_decision(uuid,uuid,uuid,text,text,timestamp with time zone,text,text,text)') IS NULL THEN
              RAISE EXCEPTION 'quality-aligned decision revision gateway missing';
            END IF;
            IF to_regprocedure('public.ai_ops_revise_decision(uuid,uuid,uuid,text,text,timestamp with time zone,text)') IS NOT NULL THEN
              RAISE EXCEPTION 'legacy public revision signature still exists';
            END IF;
            IF to_regprocedure('public.ai_ops_create_operational_context(text,uuid,text,text,uuid,timestamp with time zone,text)') IS NULL THEN
              RAISE EXCEPTION 'operational context create gateway missing';
            END IF;
            IF to_regprocedure('public.ai_ops_revoke_operational_context(uuid,text)') IS NULL THEN
              RAISE EXCEPTION 'operational context revoke gateway missing';
            END IF;
            IF to_regprocedure('public.ai_ops_worker_get_context(uuid,text)') IS NULL THEN
              RAISE EXCEPTION 'service worker context gateway missing';
            END IF;

            IF has_function_privilege('authenticated','public.ai_ops_worker_get_context(uuid,text)','EXECUTE') THEN
              RAISE EXCEPTION 'authenticated browser role can execute worker context gateway';
            END IF;
            IF NOT has_function_privilege('service_role','public.ai_ops_worker_get_context(uuid,text)','EXECUTE') THEN
              RAISE EXCEPTION 'service_role lacks worker context gateway';
            END IF;
            IF NOT has_function_privilege(
              'authenticated',
              'public.ai_ops_revise_decision(uuid,uuid,uuid,text,text,timestamp with time zone,text,text,text)',
              'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'authenticated management role lacks final revision gateway';
            END IF;
          END $$;
          SQL

      - name: Exercise zero-case seven-domain worker lifecycle
        shell: bash
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_local_now timestamp := clock_timestamp() AT TIME ZONE 'Africa/Cairo';
            v_day smallint := extract(dow from clock_timestamp() AT TIME ZONE 'Africa/Cairo')::smallint;
            v_materialized jsonb;
            v_claim jsonb;
            v_context jsonb;
            v_global jsonb;
            v_stage jsonb;
            v_retry jsonb;
            v_run_id uuid;
            v_snapshot_id uuid;
            v_hash text;
            v_prompt_hash text;
            v_status text;
            v_checkpoint text;
            v_stored_prompt_hash text;
            v_run_prompt_version text;
          BEGIN
            UPDATE ai_ops.settings
            SET planner_enabled=true, shadow_mode=true, auto_commit_enabled=false,
                updated_at=clock_timestamp();

            INSERT INTO ai_ops.run_schedules(
              code,run_type,timezone,local_time,weekdays,recovery_window_minutes,enabled,settings
            ) VALUES (
              'ci_zero_case','morning','Africa/Cairo',
              (v_local_now::time - interval '1 minute')::time,
              ARRAY[v_day]::smallint[],180,true,'{}'::jsonb
            );

            v_materialized := public.ai_ops_worker_materialize_due_runs();
            IF COALESCE((v_materialized->>'materialized')::integer,0) <> 1 THEN
              RAISE EXCEPTION 'expected one due run materialized, got %', v_materialized;
            END IF;

            v_claim := public.ai_ops_worker_claim_next_run('ci-zero-worker',1200);
            IF COALESCE((v_claim->>'claimed')::boolean,false) IS NOT TRUE THEN
              RAISE EXCEPTION 'worker did not claim due run: %', v_claim;
            END IF;
            v_run_id := (v_claim->>'run_id')::uuid;

            SELECT prompt_version INTO v_run_prompt_version
            FROM ai_ops.planner_runs WHERE id=v_run_id;
            IF v_run_prompt_version IS DISTINCT FROM 'v2' THEN
              RAISE EXCEPTION 'materialized run did not freeze prompt v2: %',v_run_prompt_version;
            END IF;

            v_context := public.ai_ops_worker_get_context(v_run_id,'ci-zero-worker');
            IF COALESCE((v_context->>'blocked')::boolean,false) THEN
              RAISE EXCEPTION 'zero-case context unexpectedly blocked: %', v_context;
            END IF;
            v_hash := v_context->>'context_hash';
            v_prompt_hash := v_context->>'prompt_hash';
            IF v_hash IS NULL OR v_prompt_hash IS NULL THEN
              RAISE EXCEPTION 'worker context/prompt hash missing';
            END IF;
            IF v_context->>'prompt_version' IS DISTINCT FROM 'v2' THEN
              RAISE EXCEPTION 'worker did not return prompt v2';
            END IF;
            IF v_context->'context'->'planner_policy'->>'system_prompt' IS NULL THEN
              RAISE EXCEPTION 'versioned planner policy missing from worker context';
            END IF;
            IF v_context->'context'->'planner_policy'->>'prompt_hash' IS DISTINCT FROM v_prompt_hash THEN
              RAISE EXCEPTION 'context planner policy hash mismatch';
            END IF;
            IF v_context->'context'->'planner_policy'->>'prompt_version' IS DISTINCT FROM 'v2' THEN
              RAISE EXCEPTION 'context planner policy is not v2';
            END IF;

            v_global := v_context->'context'->'global_operational_context';
            IF v_global->>'source' IS DISTINCT FROM 'same_frozen_snapshot' THEN
              RAISE EXCEPTION 'global operational context missing or not frozen-source based';
            END IF;
            IF jsonb_typeof(v_global->'actor_feasibility') IS DISTINCT FROM 'array' THEN
              RAISE EXCEPTION 'actor feasibility summary missing';
            END IF;
            IF jsonb_typeof(v_global->'cross_domain_entity_links') IS DISTINCT FROM 'object' THEN
              RAISE EXCEPTION 'cross-domain entity links missing';
            END IF;
            IF COALESCE((v_global->'feasibility_semantics'->>'explicit_hr_unavailability_is_hard')::boolean,false) IS NOT TRUE THEN
              RAISE EXCEPTION 'feasibility semantics are incomplete';
            END IF;

            IF jsonb_array_length(v_context->'context'->'snapshot'->'domain_captures') <> 7 THEN
              RAISE EXCEPTION 'worker context did not contain seven domain captures';
            END IF;
            IF jsonb_array_length(v_context->'context'->'cases') <> 0 THEN
              RAISE EXCEPTION 'fresh isolated database should produce zero operational cases';
            END IF;

            SELECT s.id INTO v_snapshot_id FROM ai_ops.snapshots s WHERE s.run_id=v_run_id;
            IF NOT EXISTS (
              SELECT 1 FROM ai_ops.snapshot_global_context sg
              WHERE sg.snapshot_id=v_snapshot_id AND sg.run_id=v_run_id
            ) THEN
              RAISE EXCEPTION 'global context was not frozen for replay';
            END IF;
            SELECT prompt_hash INTO v_stored_prompt_hash FROM ai_ops.planner_runs WHERE id=v_run_id;
            IF v_stored_prompt_hash IS DISTINCT FROM v_prompt_hash THEN
              RAISE EXCEPTION 'planner run did not persist exact prompt hash';
            END IF;

            v_stage := public.ai_ops_worker_stage_decisions(
              v_run_id,'ci-zero-worker',v_hash,'[]'::jsonb
            );
            IF COALESCE((v_stage->>'staged')::boolean,false) IS NOT TRUE THEN
              RAISE EXCEPTION 'zero-case decision set was not staged: %', v_stage;
            END IF;
            IF COALESCE((v_stage->>'structured_decision_quality')::boolean,false) IS NOT TRUE
               OR NULLIF(v_stage->>'quality_submission_hash','') IS NULL THEN
              RAISE EXCEPTION 'structured quality staging envelope missing: %',v_stage;
            END IF;
            IF v_stage->'run_lifecycle'->>'status' IS DISTINCT FROM 'completed' THEN
              RAISE EXCEPTION 'zero-case run did not close completed: %', v_stage;
            END IF;

            SELECT status,checkpoint INTO v_status,v_checkpoint
            FROM ai_ops.planner_runs WHERE id=v_run_id;
            IF v_status <> 'completed' OR v_checkpoint <> 'completed_zero_cases' THEN
              RAISE EXCEPTION 'zero-case durable lifecycle mismatch: % / %', v_status,v_checkpoint;
            END IF;

            v_retry := public.ai_ops_worker_stage_decisions(
              v_run_id,'ci-zero-worker',v_hash,'[]'::jsonb
            );
            IF COALESCE((v_retry->>'idempotent_reuse')::boolean,false) IS NOT TRUE THEN
              RAISE EXCEPTION 'zero-case staging retry was not idempotent: %', v_retry;
            END IF;
            IF v_retry->>'quality_submission_hash' IS DISTINCT FROM v_stage->>'quality_submission_hash' THEN
              RAISE EXCEPTION 'quality submission hash changed across exact retry';
            END IF;

            UPDATE ai_ops.settings
            SET planner_enabled=false, shadow_mode=true, auto_commit_enabled=false,
                updated_at=clock_timestamp();
          END $$;
          SQL

      - name: Stop and delete isolated database
        if: always()
        shell: bash
        env:
          SUPABASE_TELEMETRY_DISABLED: '1'
        run: |
          if [ -d .aiops-local/supabase ]; then
            cd .aiops-local
            npx --yes supabase@2.110.0 stop --no-backup || true
          fi
