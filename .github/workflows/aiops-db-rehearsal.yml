name: AI Operations Pre-Bootstrap Safety Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/work-management
      - fix/ai-operations-final-hardening
    paths:
      - supabase/migrations/*ai_operations*.sql
      - src/__tests__/ai-operations-*.test.ts
      - .github/workflows/aiops-db-rehearsal.yml
  pull_request:
    paths:
      - supabase/migrations/*ai_operations*.sql
      - src/__tests__/ai-operations-*.test.ts
      - .github/workflows/aiops-db-rehearsal.yml

permissions:
  contents: read

concurrency:
  group: aiops-pre-bootstrap-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  safety-contract:
    name: Protect production history and verify AI Operations contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify production migration history is untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --exit-code origin/main -- \
            supabase/migrations/46_notification_full_coverage.sql \
            supabase/migrations/50_notification_dispatch_complete_fix.sql \
            supabase/migrations/55_notification_wave2_inventory_and_cron.sql

          if [ -e supabase/migrations/67b_customer_code_sequence_reservation.sql ]; then
            echo "::error::Local test compatibility must not be shipped as a production migration"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify cross-domain feasibility contract
        run: npm test -- src/__tests__/ai-operations-cross-domain-feasibility-contract.test.ts

      - name: Record database qualification boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### AI Operations database qualification boundary"
            echo ""
            echo "This workflow intentionally does **not** create a database from the repository migration folder and does **not** claim that the repository is a canonical bootstrap source."
            echo ""
            echo "Until a curated/sanitized database bootstrap is committed to the repository, database qualification must be performed against the curated local test baseline by applying the approved AI Operations migration set **one file at a time**, stopping on the first error."
            echo ""
            echo "Production rollout follows the same controlled migration model: only the explicitly approved release migration files are applied individually; the complete repository migration directory is never replayed against production."
          } >> "$GITHUB_STEP_SUMMARY"
